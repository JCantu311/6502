MEMORY {
    ZP: start = $0000, size = $0100, type = rw, fill = no;
    STACK: start = $0100, size = $0100, type = rw, fill = no;
    BUFFER: start = $0200, size = $0100, type = rw, fill = no;
    RAM: start = $0200, size = $AC00, type = rw, fill = no;
    IO: start = $B000, size = $1000, type = rw, fill = no;
    ROM: start = $C000, size = $3FFA, type = ro, fill = yes;
    VECTORS: start = $FFFA, size = $0006, type = ro, fill = yes;
}

segments {
    ZEROPAGE: load = ZP, type = zp;
    CODE: load = ROM, type = ro;
    RESET: load = VECTORS, type = ro;
    STACK: load = STACK, type = rw;
    INPUT_BUFFER: load = BUFFER, type = rw;
    BASIC: load = ROM, type = ro;
    KERNEL: load = ROM, type = ro;
    MONITOR: load = ROM, type = ro;
}