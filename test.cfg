MEMORY {
    ZP: start = $0000, size = $0100, type = rw, fill = yes;
    STACK: start = $0100, size = $0100, type = rw, fill = yes;
    RAM: start = $0200, size = $BE00, type = rw, fill = yes;
    ROM: start = $C000, size = $3FFA, type = ro, fill = yes;
    RESET: start = $FFFA, size = $0006, type = ro, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STACK: load = STACK, type = rw;
    CODE: load = ROM, type = ro;
    RESET: load = RESET, type = ro;
    RAM: load = RAM, type = rw;
}